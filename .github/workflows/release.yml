name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version including build number, e.g. 1.2.3.456'
        required: true
      dryRun:
        description: Flag to enable the dry-run execution
        type: boolean
        default: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@88db3da262751434aba7139cdfd7299c7c1cefec # v7.9.0
    with:
      version: ${{ inputs.version }}
      dryRun: ${{ inputs.dryRun }}
      publishToBinaries: true
      skipPythonReleasabilityChecks: true
      slackChannel: C02E6L5C01H # squad-devex-private
      pushToDatadog: false
